<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OI 多分支刷题池</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>OI 多分支刷题池</h1>
      <a class="button primary" href="add.html">加入题池</a>
    </header>

    <main class="board" id="board"></main>

    <template id="problemCardTemplate">
      <article class="problem-card">
        <div class="problem-head">
          <a class="problem-title"></a>
          <span class="difficulty"></span>
        </div>
        <p class="problem-note"></p>
        <div class="problem-actions">
          <a class="button ghost source-link" target="_blank" rel="noopener noreferrer">原题链接</a>
          <button class="button upgrade-btn" type="button">升级到下一池</button>
          <button class="button danger delete-btn" type="button">删除题目</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
